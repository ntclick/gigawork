<svg width="128" height="128" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GigaWork">
  <title>GigaWork</title>
  <!--
    Standalone copy of components/console/Logo.tsx for use outside the app
    (README, social cards, decks). The in-app version inherits CSS accent
