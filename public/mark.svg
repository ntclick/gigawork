    </linearGradient>
  </defs>
  <path d="M16 1.8 28.4 8.9V23.1L16 30.2 3.6 23.1V8.9L16 1.8Z" stroke="url(#gw-stroke)" stroke-width="1.9" stroke-linejoin="round"/>
